name: Build OpenMinis Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Stub missing private directories
        run: mkdir -p .claude/skills/debug-server

      - name: Restore Keystore (Optional)
        if: "${{ secrets.DEBUG_KEYSTORE_B64 != '' }}"
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          echo "Keystore restored."

      - name: Build APK with Gradle
        run: |
          cd src/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
